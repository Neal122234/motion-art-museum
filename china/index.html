<style>
/* Exhibit kit — one room per chapter. Layers (bottom → top): wall · hung work · stage (transitions) · fx (room effects) · words & controls.
   Every room shares the same furniture: vertical room title, hung work, museum label, wall text, the same tools.
   Colours and fonts are tokens: build.py writes exhibit.json "palette" / "fonts" over these defaults (<style id="theme">) and inlines
   theme.css after it (extra frame styles, gate mark, anything topic-specific). Never hard-code a colour below: add a token. */
:root{
  --bg:#0b0908;--wall:#161210;--ink-light:#efe6d6;--ink-dark:#24211d;--ink:var(--ink-light);--accent:#b08d57;--gold:var(--accent);
  --ink-2:#d3c8b6;--ink-3:#b3a893;   /* secondary / tertiary text: recomputed per wall by core (≥ 7:1 and ≥ 4.6:1) — never dim text with opacity */
  --gate-bg:#050403;--gate-ink:#cdbfa8;--gate-ink-2:#a89c88;
  --view-bg:#120f0d;--view-ink:#efe6d6;--view-ink-2:#cfc4b2;--view-ink-3:#a89c88;--line:#f7f4ee;
  --font-latin:"Bodoni Moda","Didot","Bodoni 72",serif;
  --font-text:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --didone:var(--font-latin);--song:var(--font-text);   /* the names the modules use */
  --move:.85s cubic-bezier(.3,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{font:400 15px/1.8 var(--song);-webkit-font-smoothing:antialiased;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid currentColor;outline-offset:4px}

p,dd,dt,li{line-break:strict;text-wrap:pretty}h1,h2,h3,.what{text-wrap:balance}.nw{white-space:nowrap}
.room{position:fixed;inset:0;background:var(--wall);color:var(--ink);transition:background-color 1.2s ease,color 1.2s ease}
.room.snap{transition:none}
.wash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at var(--sx,55%) var(--sy,45%),rgba(255,244,225,.08),transparent 70%)}
.room.light .wash{background:radial-gradient(ellipse 70% 60% at var(--sx,55%) var(--sy,45%),rgba(255,255,255,.35),transparent 70%)}
canvas.full{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#stage{z-index:3;opacity:0}
#stage.on{opacity:1}
#fx{z-index:4}
.ovl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}   /* room overlay layers (ctx.layer), above text */
.chrome{transition:opacity .9s ease}
.room.nochrome .chrome{opacity:0!important;pointer-events:none}
.mark{position:absolute;z-index:6;top:calc(22px + env(safe-area-inset-top,0px));left:36px;font:400 13px/1 var(--song);letter-spacing:.2em;color:var(--ink-3)}
.mark i{font:italic 400 14px/1 var(--didone);letter-spacing:.02em;margin-left:10px}
.lobby-btn{position:absolute;z-index:31;top:calc(17px + env(safe-area-inset-top,0px));left:30px;display:inline-flex;align-items:center;gap:7px;padding:3px 2px;font:400 12px/1 var(--song);letter-spacing:.22em;text-decoration:none;color:var(--ink-3);transition:color .35s ease}
.lobby-btn:hover,.lobby-btn:focus-visible{color:var(--ink-2)}
.lobby-btn svg{width:17px;height:17px;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.lobby-btn .lf,.lobby-btn .rf{transform-box:fill-box;transition:transform .45s cubic-bezier(.3,.7,.2,1)}.lobby-btn .lf{transform-origin:left center}.lobby-btn .rf{transform-origin:right center}
.lobby-btn .glow{fill:var(--lb-glow);stroke:none;opacity:0;transition:opacity .45s ease}
.lobby-btn:hover .lf,.lobby-btn:focus-visible .lf,.lobby-btn:hover .rf,.lobby-btn:focus-visible .rf{transform:scaleX(.3)}
.lobby-btn:hover .glow,.lobby-btn:focus-visible .glow{opacity:.9}
.lobby-btn:focus-visible{outline:1px solid currentColor;outline-offset:4px}
@media (prefers-reduced-motion:reduce){.lobby-btn .lf,.lobby-btn .rf,.lobby-btn .glow{transition:none}}
@media (max-width:720px){.lobby-btn{left:12px;gap:6px;font-size:11px}.lobby-btn svg{width:16px;height:16px}}
.lobby-btn{--lb-glow:#efb877}
.hint .lobby-end{color:var(--ink-2);text-decoration:underline;text-decoration-color:currentColor;text-decoration-thickness:1px;text-underline-offset:4px;white-space:nowrap}.hint.on .lobby-end{pointer-events:auto}

/* the hung painting: positioned by script; position and size move together */
.frame{position:absolute;z-index:2;left:0;top:0;padding:var(--fp,0px);transition:left var(--move),top var(--move),padding var(--move),opacity .5s ease}
.frame::before{content:"";position:absolute;inset:0;opacity:var(--deco,1);transition:opacity .6s ease;pointer-events:none}
.frame.f-gilt::before{background:linear-gradient(160deg,#6d5230,#3a2a14 55%,#5c4424);box-shadow:inset 0 0 0 1px #1c1409,inset 0 0 0 5px #7a5e35,inset 0 0 0 6px #241a0c,0 28px 70px -24px rgba(0,0,0,.8)}
.frame.f-white::before{background:#f2f0eb;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 0 0 9px #f2f0eb,inset 0 0 0 10px rgba(0,0,0,.08),0 22px 50px -22px rgba(0,0,0,.45)}
.frame.f-stone::before{background:linear-gradient(180deg,#5b554c,#3f3a33);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 24px 60px -24px rgba(0,0,0,.7)}
.frame.f-none::before{box-shadow:0 26px 60px -26px rgba(0,0,0,.6)}
.frame.hidden{opacity:0;pointer-events:none}
.frame.still,.frame.still canvas{transition:none!important}
.cw{position:relative;line-height:0;overflow:hidden;cursor:zoom-in}
.frame.f-fade .cw{-webkit-mask-image:radial-gradient(ellipse 58% 60% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 58% 60% at 50% 50%,#000 62%,transparent 100%)}
.cw canvas{display:block;transition:width var(--move),height var(--move)}
.cw .cmp{position:absolute;inset:0;display:none;pointer-events:none}
.cw .cmp.on{display:block}
#cmpA{z-index:3}#cmpB{z-index:2}
.split{position:absolute;z-index:4;top:0;bottom:0;left:50%;width:44px;margin-left:-22px;cursor:ew-resize;display:none;touch-action:none}
.split::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.split.on{display:block}
.cmpl{position:absolute;inset:0;z-index:5;pointer-events:none}   /* above the room effects (#fx), placed by core under the frame */
.side{position:absolute;font:400 13px/1.5 var(--song);color:var(--ink-2);display:none}
.side.on{display:block}#sB{text-align:right}.cmpl.stack .side{white-space:nowrap}.cmpl.stack #sB{text-align:left}

/* museum label and vertical room title */
.label{position:absolute;z-index:5;left:0;top:0;width:clamp(256px,15vw,320px);font:400 clamp(13px,.3vw + 9px,15.5px)/1.75 var(--song);overflow-wrap:anywhere;opacity:0;transition:opacity .9s ease;pointer-events:none}
.label.on{opacity:1}
.label .who{margin:0;font-weight:500;font-size:13.5px}
.label .who>span{display:block;margin-top:2px;font:400 .96em/1.5 var(--didone);color:var(--ink-2)}
.label .what{margin:10px 0 8px;font:400 1.3em/1.45 var(--song);text-wrap:balance}
.label .meta{margin:0;color:var(--ink-2)}
.meta>span{display:block}.meta>span+span{margin-top:3px}
.label .credit{margin:6px 0 0;font-size:11px;opacity:.5}
.era{position:absolute;z-index:5;left:64px;top:96px;bottom:170px;max-height:760px;width:clamp(170px,11vw,230px);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:28px;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
.era.on{opacity:1}
.era h1{margin:0;min-height:0;writing-mode:vertical-rl;font:300 var(--tfs,60px)/1 var(--song);letter-spacing:.34em}
.era .cap{display:flex;flex-direction:column;gap:6px;width:100%}
.era .one{margin:0 0 6px;font:400 clamp(13.5px,.3vw + 9.5px,16px)/1.8 var(--song);color:var(--ink-2)}
.era .lat{margin:0;font:italic 400 19px/1.25 var(--didone)}
.era .yrs{margin:0;font:400 13px/1.2 var(--didone);letter-spacing:.06em;white-space:nowrap;color:var(--ink-3)}
.era.spray h1{-webkit-mask-image:radial-gradient(circle at 50% 30%,#000 var(--m,0%),transparent calc(var(--m,0%) + 18%));mask-image:radial-gradient(circle at 50% 30%,#000 var(--m,0%),transparent calc(var(--m,0%) + 18%))}

/* the gate (first gesture: starts sound and the opening) */
.gate{position:absolute;inset:0;z-index:30;display:grid;place-items:center;cursor:pointer;background:var(--gate-bg);transition:opacity 1.2s ease}
.gate.off{opacity:0;pointer-events:none}
.gate p{margin:0;text-align:center;font:300 15px/2 var(--song);letter-spacing:.2em;color:var(--gate-ink)}
.gate p i{display:block;font:italic 400 14px/1.6 var(--didone);letter-spacing:.04em;color:var(--gate-ink-2)}
.gate .keys{display:none;margin-top:18px;font:400 13px/1.6 var(--song);letter-spacing:.12em;color:var(--gate-ink-2)}
@media (hover:hover){.gate .keys{display:block}}
.gate .gmark{margin:0 auto 26px;display:flex;justify-content:center}
.gate .flame{width:10px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff2c8,#ffb347 45%,#c2410c 80%,transparent 81%);filter:blur(.4px);box-shadow:0 0 40px 18px rgba(255,150,60,.22);animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.92,1.08) translateX(.5px)}70%{transform:scale(1.05,.96) translateX(-.5px)}}

/* timeline + controls */
.foot{position:absolute;z-index:6;left:36px;right:36px;bottom:calc(26px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:36px}
.line{flex:1;position:relative;height:40px}
.line .rule{position:absolute;left:0;right:0;bottom:12px;height:1px;background:currentColor;opacity:.22}
.line .tick{position:absolute;bottom:0;width:28px;height:34px;margin-left:-14px;cursor:default}
.line .tick::after{content:"";position:absolute;left:14px;bottom:12px;width:1px;height:5px;background:currentColor;opacity:.35}
.line .tick.built{cursor:pointer}.line .tick.built::after{height:9px;opacity:.9}
.line .dot{position:absolute;bottom:9px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:currentColor;transition:left .4s linear;pointer-events:none}
.line .now{position:absolute;bottom:26px;transform:translateX(-50%);font:400 12.5px/1 var(--song);letter-spacing:.12em;white-space:nowrap;transition:left .6s ease;pointer-events:none}
.ctl{display:flex;gap:26px;white-space:nowrap}
.ctl button,.textbtn{min-height:44px;min-width:44px;font:400 14px/1 var(--song);letter-spacing:.08em;padding:0;color:var(--ink-2);text-decoration:underline transparent;text-underline-offset:6px;transition:color .2s,text-decoration-color .2s}
.ctl button:hover,.textbtn:hover{color:var(--ink);text-decoration-color:currentColor}
#sound[aria-pressed="true"]{color:var(--ink-3)}
#auto::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;border-radius:50%;border:1px solid currentColor;vertical-align:.12em}
#auto[aria-pressed="true"]::before{background:currentColor}
.skip{position:absolute;z-index:31;right:36px;bottom:calc(26px + env(safe-area-inset-bottom,0px));min-height:44px;font:400 13px/1 var(--song);letter-spacing:.14em;color:var(--gate-ink-2);opacity:0;pointer-events:none;transition:opacity .6s ease}
.skip.on{opacity:1;pointer-events:auto}.skip:hover{color:var(--ink-light)}
.hint{position:absolute;z-index:6;right:36px;top:calc(22px + env(safe-area-inset-top,0px));max-width:min(420px,50vw);text-align:right;font:400 12.5px/1.6 var(--song);color:var(--ink-3);opacity:0;transition:opacity 1s ease;pointer-events:none}
.hint.on{opacity:1}.hint.end{font-size:14px;color:var(--ink-2)}

/* reading: the painting steps aside, the wall text is written on the wall */
.room.reading .era,.room.reading .hint,.room.reading .label{opacity:0!important}
.read{position:absolute;z-index:7;top:64px;bottom:96px;right:0;width:min(50vw,640px);overflow-y:auto;overflow-x:hidden;padding:28px 64px 72px 40px;opacity:0;visibility:hidden;transform:translateX(24px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 48px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 48px),transparent 100%);
  transition:opacity .5s ease,transform var(--move),visibility 0s linear .5s;overscroll-behavior:contain;scrollbar-width:thin}
.room.reading .read{opacity:1;visibility:visible;transform:none;transition:opacity .7s ease .15s,transform var(--move)}
.read h2{margin:0;font:300 44px/1.15 var(--song);letter-spacing:.14em}
.read .lat{margin:6px 0 0;font:italic 400 20px/1.3 var(--didone)}
.read .lede{margin:26px 0 8px;font:400 20px/1.7 var(--song);max-width:26em}
.read h3{margin:36px 0 8px;font:500 16px/1.5 var(--song);letter-spacing:.06em}
.read p{margin:0 0 12px;max-width:34em;font:400 15px/1.95 var(--song)}
.read .q{margin:18px 0;padding-left:22px;border-left:1px solid currentColor;max-width:30em}
.read .q p{margin:0;font:300 17px/1.85 var(--song)}
.read .q small{display:block;margin-top:8px;font:400 13px/1.7 var(--song);color:var(--ink-3)}
.read dl{margin:0;max-width:34em}
.read dt{margin-top:14px;font:500 15px/1.6 var(--song)}
.read dd{margin:2px 0 0;font:400 14.5px/1.9 var(--song);color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:0 24px;margin:0 0 4px}
.act{min-height:44px;min-width:44px;font:400 15px/1.9 var(--song);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.act[aria-pressed="true"]{font-weight:500;text-decoration-thickness:2px}
.act[aria-pressed="true"]::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;border-radius:50%;background:currentColor;vertical-align:.2em}
.plate{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:34em;margin:8px 0 4px}
.plate figure{margin:0}.plate img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:rgba(127,127,127,.08)}
.plate figcaption{margin-top:6px;font:400 13px/1.6 var(--song);color:var(--ink-2)}
.pal{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;align-items:center;max-width:34em;margin:10px 0 6px;font:400 13px/1.5 var(--song)}
.pal .bar{display:flex;height:22px}
.pal .bar i{display:block;flex:var(--g) 1 0}
.small{font-size:13.5px!important;color:var(--ink-2)}
.works{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 18px;max-width:34em;margin-top:12px}
.work{text-align:left;cursor:zoom-in}
.work img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(.95);transition:filter .3s}
.work:hover img{filter:saturate(1.1)}
.work b{display:block;margin-top:8px;font:400 13.5px/1.5 var(--song)}
.work>span{display:block;margin-top:2px;font:400 12.5px/1.5 var(--song);color:var(--ink-3)}
.special{max-width:34em;margin-top:8px}
.special canvas{display:block;max-width:100%}
.foot-note{margin-top:34px!important;font:400 12.5px/1.8 var(--song)!important;color:var(--ink-3);overflow-wrap:anywhere}
.src{max-width:34em;margin-top:6px;font:400 12.5px/1.7 var(--song);color:var(--ink-3)}
.src summary{cursor:pointer;min-height:44px;display:flex;align-items:center;list-style-position:inside}
.src ol{margin:4px 0 0;padding-left:1.6em}.src li{margin:3px 0;overflow-wrap:anywhere}
.src a{color:inherit;text-decoration:none}.src a:hover{text-decoration:underline}

/* the viewer: any artwork, full screen, zoom and pan */
.view{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--view-bg) 0%,transparent);visibility:hidden;transition:background-color .45s ease,visibility 0s linear .45s;color:var(--view-ink);touch-action:none}
.view.on{background:var(--view-bg);visibility:visible;transition:background-color .45s ease}
.view canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;cursor:grab;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.view canvas.cut{box-shadow:none}
.view canvas.anim{transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.view .vlab{position:absolute;left:36px;bottom:calc(26px + env(safe-area-inset-bottom,0px));max-width:420px;font:400 13px/1.7 var(--song);overflow-wrap:anywhere;opacity:0;transition:opacity .4s ease .2s;pointer-events:none}
.view.on .vlab{opacity:1}.view.on.zoomed .vlab{opacity:0}
.view .vlab .who{margin:0;font-weight:500;font-size:13.5px}
.view .vlab .who>span{display:block;font:400 12.5px/1.5 var(--didone);color:var(--view-ink-2)}
.view .vlab .what{margin:6px 0 6px;font-size:17px;text-wrap:balance}
.view .vlab .meta,.view .vlab .note{margin:0;color:var(--view-ink-2)}.view .vlab .note{margin-top:8px}
.view .vlab .credit{margin:8px 0 0;font-size:12px;color:var(--view-ink-3)}
.view .vtools{position:absolute;right:28px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:20px;padding:0 12px;background:color-mix(in srgb,var(--view-bg) 72%,transparent);opacity:0;transition:opacity .4s ease .2s}
.view.on .vtools{opacity:1}
.view .vtools .textbtn{color:var(--view-ink)}
.view .vhint{position:absolute;right:28px;bottom:calc(24px + env(safe-area-inset-bottom,0px));padding:6px 12px;background:color-mix(in srgb,var(--view-bg) 72%,transparent);font:400 12.5px/1.4 var(--song);color:var(--view-ink-3)}
/* long scrolls (room.scroll): #vs holds one moved layer of <img> tiles (placed by core), .vsh is its shadow, .vbar the thin whole-scroll strip */
.view #vs,.view .vsh,.view .vbar{display:none}
.view.scroll #vc{display:none}
.view.scroll #vs{display:block;position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#vsc{position:absolute;left:0;top:0;will-change:transform}
#vsc img{position:absolute;left:0;top:0;display:block;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
#vslo{z-index:0}#vswin{z-index:0}#vst{position:absolute;left:0;top:0;z-index:1}
.view.scroll #vs.grabbing{cursor:grabbing}
.view.scroll .vsh{display:block;position:absolute;pointer-events:none;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.view.scroll .vbar{display:block;position:absolute;cursor:pointer;opacity:0;transition:opacity .4s ease .2s;touch-action:none}
.view.scroll.on .vbar{opacity:1}
.view .vbar canvas{position:static;display:block;width:100%;height:100%;transform:none;will-change:auto;box-shadow:none;opacity:.55;cursor:pointer}
.view .vbar i{position:absolute;top:-3px;bottom:-3px;left:0;width:3px;box-shadow:0 0 0 1px var(--view-ink);pointer-events:none}
.lens{position:fixed;width:200px;height:200px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--line),0 14px 40px rgba(0,0,0,.45);overflow:hidden;display:none;z-index:30}
.lens canvas{width:100%;height:100%}

@media (max-width:980px){
  .era{left:36px;top:52px;bottom:auto;width:auto}
  .era h1{writing-mode:horizontal-tb;font-size:34px;letter-spacing:.2em}
  .era .cap{margin-top:6px}.era .lat{font-size:16px}.era .one,.era .yrs{display:none}
  .read{left:0;width:auto;padding:24px 28px 72px 36px;top:64px}
  .label{width:min(300px,calc(100vw - 72px))}
}

/* ---------------------------------------------------------------- 入口：按下一方印 */
.gate .gmark{margin-bottom:30px}
.gate .seal{width:92px;height:92px;transform-origin:50% 62%;
  transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.gate .seal-svg{display:block;width:100%;height:100%;overflow:visible}
@media (hover:hover){
  .gate:hover .seal{transform:translateY(-5px) scale(1.035);filter:drop-shadow(0 12px 10px rgba(0,0,0,.75))}   /* 提起印，悬在纸上 */
}
.gate:focus-visible .seal{transform:translateY(-5px) scale(1.035);filter:drop-shadow(0 12px 10px rgba(0,0,0,.75))}
.gate:active .seal,.gate.off .seal{transform:translateY(1px) scale(.965);filter:drop-shadow(0 1px 1px rgba(0,0,0,.85)) saturate(1.12) brightness(.93);
  transition-duration:.07s,.07s;transition-timing-function:cubic-bezier(.5,0,.9,.4)}                              /* 落下、压实 */
@media (max-width:560px){.gate .seal{width:72px;height:72px}.gate .gmark{margin-bottom:26px}}
@media (prefers-reduced-motion:reduce){.gate .seal{transition:none}.gate:hover .seal,.gate:focus-visible .seal{transform:none}}

/* ---------------------------------------------------------------- 立轴 / 竖挂书画：f-mount（exhibit.json frames.mount = 圈档宽）
   引擎给的是四边等宽的 --fp（圈档/隔水）；天头、地头、地杆和轴头画在框外（::before 上下伸出，::after 是地杆），
   所以装裱实际比 #frame 高 --mt-t + --mt-d + 地杆；轴头只外凸 2 px（右侧展签距 #frame 约 33 px，要守 ≥ 32 px 的余量里）。天头长、地头短（约 2.5 : 1），是通行比例的示意，不是某件原作的装裱。 */
.frame.f-mount{--mt-t:calc(var(--fp)*1.25);--mt-d:calc(var(--fp)*.5);--mt-tb:var(--mt-t);--mt-db:var(--mt-d);--mt-j:max(1.5px,calc(var(--fp)*.07));
  --mt-r:max(5px,calc(var(--fp)*.34));--mt-z:2px;--mt-kw:max(5px,calc(var(--fp)*.3));--mt-rb:calc(-1*var(--mt-d) - var(--mt-r)*.55)}
.frame.f-mount::before{top:calc(-1*var(--mt-t));bottom:calc(-1*var(--mt-d));
  background:
    var(--ling) 0 0/256px 256px,                                                                              /* 绫的织纹（千里江山引首绫的比值纹理） */
    linear-gradient(var(--mt-rod),var(--mt-rod)) 0 0/100% max(2px,calc(var(--fp)*.12)) no-repeat,                /* 天杆 */
    linear-gradient(90deg,var(--mt-edge),transparent 18%,transparent 82%,var(--mt-edge)) 30% 0/max(3px,calc(var(--fp)*.3)) calc(var(--mt-tb)*.94) no-repeat,
    linear-gradient(90deg,var(--mt-edge),transparent 18%,transparent 82%,var(--mt-edge)) 70% 0/max(3px,calc(var(--fp)*.3)) calc(var(--mt-tb)*.94) no-repeat,
    linear-gradient(var(--mt-yan),var(--mt-yan)) 30% 0/max(3px,calc(var(--fp)*.3)) calc(var(--mt-tb)*.94) no-repeat,  /* 惊燕 */
    linear-gradient(var(--mt-yan),var(--mt-yan)) 70% 0/max(3px,calc(var(--fp)*.3)) calc(var(--mt-tb)*.94) no-repeat,
    linear-gradient(var(--mt-ju),var(--mt-ju)) calc(var(--fp) - var(--mt-j)) calc(var(--mt-t) + var(--fp) - var(--mt-j))
      /calc(100% - 2*var(--fp) + 2*var(--mt-j)) calc(100% - var(--mt-t) - var(--mt-d) - 2*var(--fp) + 2*var(--mt-j)) no-repeat,   /* 局条 */
    linear-gradient(to bottom,var(--mt-tian) 0,var(--mt-tian) var(--mt-tb),var(--mt-edge) var(--mt-tb),var(--mt-edge) calc(var(--mt-tb) + 1px),
      var(--mt-quan) calc(var(--mt-tb) + 1px),var(--mt-quan) calc(100% - var(--mt-db) - 1px),var(--mt-edge) calc(100% - var(--mt-db) - 1px),
      var(--mt-edge) calc(100% - var(--mt-db)),var(--mt-tian) calc(100% - var(--mt-db)));                        /* 天头 | 圈档与隔水 | 地头 */
  background-blend-mode:soft-light,normal,normal,normal,normal,normal,normal,normal;
  box-shadow:0 3px 4px -1px rgba(0,0,0,.35),0 22px 34px -16px rgba(0,0,0,.6)}                                    /* 上窄下宽的软影 */
.frame.f-mount::after{content:"";position:absolute;pointer-events:none;opacity:var(--deco,1);transition:opacity .6s ease;
  left:calc(-1*var(--mt-z));right:calc(-1*var(--mt-z));bottom:var(--mt-rb);height:var(--mt-r);border-radius:2px;
  background:
    linear-gradient(to bottom,var(--mt-knob-hi),var(--mt-knob) 55%,var(--mt-rod)) 0 0/var(--mt-kw) 100% no-repeat,        /* 轴头 */
    linear-gradient(to bottom,var(--mt-knob-hi),var(--mt-knob) 55%,var(--mt-rod)) 100% 0/var(--mt-kw) 100% no-repeat,
    linear-gradient(to bottom,var(--mt-rod-hi),var(--mt-rod) 60%,#171109) 0 0/100% 100% no-repeat;                                    /* 地杆 */
  box-shadow:0 5px 8px -3px rgba(0,0,0,.6)}

/* ≤ 1180 px（展签在作品下方）和手机横屏：悬挂区上下离文字只有 16–40 px（core areaFor），天头地头地杆都收进 --fp 以内，不向外伸 */
@media (max-width:1180px),(max-height:520px){
  .frame.f-mount{--mt-t:0px;--mt-d:0px;--mt-tb:calc(var(--fp)*.55);--mt-db:calc(var(--fp)*.3);--mt-z:0px;--mt-rb:0px}
}

/* ---------------------------------------------------------------- 手卷：f-scroll（占位，第二批做案上展卷时定稿）
   只有上下两道窄绫边（圈档），左右不装；卷筒、案面由转场/停留模块画在画布上。 */
.frame.f-scroll::before{background:
  linear-gradient(to bottom,var(--mt-quan) 0,var(--mt-quan) var(--fp),transparent var(--fp),transparent calc(100% - var(--fp)),var(--mt-quan) calc(100% - var(--fp)));
  box-shadow:none}

/* ---------------------------------------------------------------- 器物：frame "none" + main_cut + shadow.webp（持矛者先例）
   抠图的落影由转场模块画（shadow.webp），这里去掉内置的矩形投影，免得抠图底下多一块方影。 */
.frame.f-none::before{box-shadow:none}
</style>
